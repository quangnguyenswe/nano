volumes:
  db:

services:
  db:
    image: postgres:17-alpine
    env_file:
      - apps/api/.env
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 3sl3erxn0cyzqmq4h80c1
      POSTGRES_DB: nano
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nano"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

networks:
  default:
    driver: bridge